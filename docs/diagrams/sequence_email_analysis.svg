<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="760" fill="#0f172a"/>
  <text x="600" y="32" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">Sequence: Email Analysis Request → Alert Delivery</text>

  <!-- lifelines -->
  <g font-size="12" fill="#e2e8f0">
    <text x="90" y="64" text-anchor="middle" font-weight="700">Dashboard</text>
    <text x="290" y="64" text-anchor="middle" font-weight="700">FastAPI</text>
    <text x="490" y="64" text-anchor="middle" font-weight="700">Redis</text>
    <text x="690" y="64" text-anchor="middle" font-weight="700">Celery Worker</text>
    <text x="900" y="64" text-anchor="middle" font-weight="700">Detection Engine</text>
    <text x="1090" y="64" text-anchor="middle" font-weight="700">Postgres</text>
  </g>
  <g stroke="#334155" stroke-width="1.5">
    <line x1="90" y1="76" x2="90" y2="720"/>
    <line x1="290" y1="76" x2="290" y2="720"/>
    <line x1="490" y1="76" x2="490" y2="720"/>
    <line x1="690" y1="76" x2="690" y2="720"/>
    <line x1="900" y1="76" x2="900" y2="720"/>
    <line x1="1090" y1="76" x2="1090" y2="720"/>
  </g>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <g font-size="11" fill="#e2e8f0">
  <line x1="90" y1="100" x2="290" y2="100" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="100" y="94">POST /api/v1/emails/analyze {raw_mime, account_id}</text>

  <line x1="290" y1="130" x2="490" y2="130" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="300" y="124">analyze_email.delay(raw_mime, account_id)</text>

  <line x1="290" y1="150" x2="90" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="100" y="144">202 Accepted {task_id, status: queued}</text>

  <line x1="490" y1="180" x2="690" y2="180" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="500" y="174">task dequeued</text>

  <rect x="670" y="200" width="440" height="200" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="890" y="220" text-anchor="middle" fill="#93c5fd" font-weight="700">run_pipeline() — feature engineering</text>
  <text x="690" y="240">clean_email → extract_header_features → extract_lexical_features</text>
  <text x="690" y="256">→ BertEmbedder.embed() → extract_urls_from_email → extract_url_features()</text>

  <line x1="690" y1="280" x2="900" y2="280" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="700" y="274">engine.infer(bundle)</text>
  <text x="690" y="300">RF/XGB (tabular) · BERT head (semantic) · IsolationForest</text>
  <text x="690" y="316">+ Denoising Autoencoder (anomaly) · LogisticRegression meta-learner</text>
  <text x="690" y="336">compute_shap_explanations() → SHAP TreeExplainer → NL narrative</text>

  <line x1="900" y1="360" x2="690" y2="360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="710" y="354">DetectionResult{category, severity, meta_confidence, shap, nl_summary}</text>

  <line x1="690" y1="420" x2="1090" y2="420" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="700" y="414">INSERT email_events, model_predictions, url_records, phishing_detections</text>

  <line x1="690" y1="450" x2="1090" y2="450" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="700" y="444">IF severity in {critical,high,medium}: INSERT alerts (priority_rank)</text>

  <rect x="670" y="470" width="440" height="70" rx="8" fill="#7f1d1d" stroke="#f87171"/>
  <text x="890" y="490" text-anchor="middle" fill="#fecaca" font-weight="700">IF severity == CRITICAL: automated response</text>
  <text x="690" y="510">INSERT response_actions(quarantine, notify_analyst) · alert.status = escalated</text>
  <text x="690" y="526">write_audit_log() → sha256 hash-chained audit_logs row</text>

  <line x1="690" y1="570" x2="490" y2="570" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="500" y="564">store task result</text>

  <line x1="90" y1="600" x2="290" y2="600" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="100" y="594">GET /api/v1/emails/analyze/{task_id}  (or poll /alerts every 15s)</text>

  <line x1="290" y1="630" x2="490" y2="630" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="490" y1="650" x2="290" y2="650" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="300" y="644">AsyncResult(task_id).result</text>

  <line x1="290" y1="680" x2="90" y2="680" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="100" y="674">200 OK — DetectionResultOut (rendered in SHAP panel + alert grid)</text>
  </g>
</svg>
